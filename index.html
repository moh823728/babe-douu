<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Douaa</title>
    
    <!-- استدعاء مكتبة Google Model Viewer ومفكك الضغط لـ Meshopt -->
    <script>
        self.ModelViewerElement = self.ModelViewerElement || {};
        self.ModelViewerElement.meshoptDecoderLocation = 'https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js';
    </script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #1c0d02, #3d1e0b, #2a1205);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            z-index: 2; /* حتى تكون المحتويات فوق تأثير الفراشات */
        }

        /* تنسيق عنصر عرض الـ 3D في المنتصف تماماً */
        model-viewer {
            width: 100%;
            height: 380px;
            background-color: transparent;
            --poster-color: transparent;
            --progress-bar-color: #e28743;
            --progress-bar-height: 3px;
        }

        /* تنسيقات أنيميشن الفراشات الساقطة */
        .butterfly {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
            }
            50% {
                transform: translateY(50vh) rotate(15deg) translateX(15px);
            }
            100% {
                transform: translateY(105vh) rotate(-15deg) translateX(-15px);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- عنصر الـ 3D لباقة الورد -->
        <model-viewer 
            src="model.glb" 
            auto-rotate 
            camera-controls 
            touch-action="pan-y"
            alt="3D Flower"
            loading="eager"
            reveal="auto">
        </model-viewer>
    </div>

    <!-- مشغل الصوت المدمج والمتوافق 100% مع الجوالات (iPhone و Android) والكمبيوتر -->
    <audio id="bg-audio" loop preload="auto" playsinline>
        <source src="song.mp3" type="audio/mpeg">
        <source src="song.m4a" type="audio/mp4">
    </audio>

    <script>
        // --- كود أنيميشن الفراشات الساقطة ---
        function createButterfly() {
            const butterfly = document.createElement('div');
            butterfly.classList.add('butterfly');
            butterfly.innerText = '🦋';

            butterfly.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 15 + 15;
            butterfly.style.fontSize = size + 'px';

            const duration = Math.random() * 3 + 4;
            butterfly.style.animationDuration = duration + 's';

            butterfly.style.opacity = Math.random() * 0.7 + 0.3;

            document.body.appendChild(butterfly);

            setTimeout(() => {
                butterfly.remove();
            }, duration * 1000);
        }

        setInterval(createButterfly, 400);

        // --- نظام تشغيل الصوت المتوافق مع الجوالات وأجهزة الكمبيوتر ---
        const bgAudio = document.getElementById('bg-audio');

        // 1. محاولة التشغيل التلقائي فور فتح الصفحة (للكمبيوتر والمتصفحات الداعمة)
        function tryAutoplay() {
            if (!bgAudio) return;
            const playPromise = bgAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // سياسة المتصفح في الهواتف تمنع الصوت قبل أول لمسة
                });
            }
        }

        // 2. للهواتف الذكية (iOS Safari و Android): أول لمسة في أي مكان بالشاشة تشغل الصوت فوراً
        function handleMobileInteraction() {
            if (!bgAudio) return;
            bgAudio.play().then(() => {
                ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
                    window.removeEventListener(evt, handleMobileInteraction);
                });
            }).catch(() => {});
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryAutoplay);
        } else {
            tryAutoplay();
        }

        ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(evt => {
            window.addEventListener(evt, handleMobileInteraction, { passive: true });
        });
    </script>
</body>
</html>
