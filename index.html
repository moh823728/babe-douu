<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Douaa</title>
    
    <!-- استدعاء مكتبة Google Model Viewer ومفكك الضغط لـ Meshopt -->
    <script>
        self.ModelViewerElement = self.ModelViewerElement || {};
        self.ModelViewerElement.meshoptDecoderLocation = 'https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js';
    </script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #1c0d02, #3d1e0b, #2a1205);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            z-index: 2; /* حتى تكون المحتويات فوق تأثير الفراشات */
        }

        /* تنسيق عنصر عرض الـ 3D في المنتصف تماماً */
        model-viewer {
            width: 100%;
            height: 380px;
            background-color: transparent;
            --poster-color: transparent;
            --progress-bar-color: #e28743;
            --progress-bar-height: 3px;
        }

        /* تنسيقات أنيميشن الفراشات الساقطة */
        .butterfly {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) rotate(15deg) translateX(15px);
            }
            100% {
                transform: translateY(105vh) rotate(-15deg) translateX(-15px);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- عنصر الـ 3D للوردة بدلاً من رائد الفضاء -->
        <model-viewer 
            src="model.glb" 
            auto-rotate 
            camera-controls 
            touch-action="pan-y"
            alt="3D Flower">
        </model-viewer>
    </div>

    <script>
        // --- كود أنيميشن الفراشات الساقطة ---
        function createButterfly() {
            const butterfly = document.createElement('div');
            butterfly.classList.add('butterfly');
            butterfly.innerText = '🦋';

            butterfly.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 15 + 15;
            butterfly.style.fontSize = size + 'px';

            const duration = Math.random() * 3 + 4;
            butterfly.style.animationDuration = duration + 's';

            butterfly.style.opacity = Math.random() * 0.7 + 0.3;

            document.body.appendChild(butterfly);

            setTimeout(() => {
                butterfly.remove();
            }, duration * 1000);
        }

        setInterval(createButterfly, 400);
    </script>

    <!-- مشغل الصوت المخفي بالكامل في الخلفية (بدون نافذة أو أزرار) -->
    <div id="yt-player-container" style="position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden;">
        <div id="youtube-player"></div>
    </div>

    <!-- كود تشغيل الصوت من يوتيوب تلقائياً وبأفضل أداء لـ GitHub Pages -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer = null;

        function onYouTubeIframeAPIReady() {
            const playerVars = {
                'autoplay': 1,
                'controls': 0,
                'disablekb': 1,
                'fs': 0,
                'loop': 1,
                'playlist': 'GEucCNFsr84',
                'playsinline': 1
            };
            if (window.location.protocol.startsWith('http')) {
                playerVars.origin = window.location.origin;
            }

            ytPlayer = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: 'GEucCNFsr84',
                playerVars: playerVars,
                events: {
                    'onReady': function(event) {
                        event.target.setVolume(100);
                        event.target.playVideo();
                    }
                }
            });
        }

        // ضمان تشغيل الصوت عند أول تفاعل/لمسة في حال قيد المتصفح التشغيل التلقائي (Autoplay Policy)
        function startAudioOnUserTouch() {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
            }
            window.removeEventListener('click', startAudioOnUserTouch);
            window.removeEventListener('touchstart', startAudioOnUserTouch);
            window.removeEventListener('pointerdown', startAudioOnUserTouch);
        }

        window.addEventListener('click', startAudioOnUserTouch, { passive: true });
        window.addEventListener('touchstart', startAudioOnUserTouch, { passive: true });
        window.addEventListener('pointerdown', startAudioOnUserTouch, { passive: true });
    </script>

</body>
</html>
